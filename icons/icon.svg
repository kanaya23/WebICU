<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Soft Bauhaus drop shadow -->
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#181818" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Bauhaus Container: Warm Cream Background (#f9f8f6) with Bold Ink Border (#181818) -->
  <rect x="5" y="5" width="118" height="118" rx="28" ry="28" fill="#f9f8f6" stroke="#181818" stroke-width="4.5" />

  <!-- Secondary Upper Eyelid / Scanner Arc (Echo Contour from Reference) -->
  <path d="M 28,48 Q 64,22 100,48" 
        fill="none" 
        stroke="#181818" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Secondary Lower Eyelid Arc -->
  <path d="M 32,80 Q 64,98 96,80" 
        fill="none" 
        stroke="#ded9d0" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Main Eye Lens Contour (Web I See You): Pure White Sclera with Bold Black Linework -->
  <path d="M 16,64 Q 64,28 112,64 Q 64,100 16,64 Z" 
        fill="#ffffff" 
        stroke="#181818" 
        stroke-width="5" 
        stroke-linejoin="round" 
        filter="url(#subtleShadow)" />

  <!-- Concentric Bauhaus Iris & Optics -->
  <circle cx="64" cy="64" r="23" fill="#f2efe9" stroke="#181818" stroke-width="3.5" />
  <circle cx="64" cy="64" r="15" fill="#eae5dc" stroke="#181818" stroke-width="2.5" />
  
  <!-- Pupil -->
  <circle cx="64" cy="64" r="9.5" fill="#181818" />
  <!-- Specular Light Reflection -->
  <circle cx="68" cy="60" r="3" fill="#ffffff" />

  <!-- ICU Medical Vital Sign Heartbeat Pulse Line (ECG Waveform in Bauhaus Primary Red #d32f2f) -->
  <path d="M 10,64 L 33,64 L 38,71 L 43,56 L 48,77 L 54,20 L 61,95 L 67,53 L 73,69 L 80,56 L 87,64 L 118,64" 
        fill="none" 
        stroke="#d32f2f" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Vital Pulse Indicator Peak Dot -->
  <circle cx="54" cy="20" r="3.2" fill="#d32f2f" />
</svg>
